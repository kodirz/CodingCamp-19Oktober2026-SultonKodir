<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
    </button>

    <div class="container">
        <!-- Greeting Section -->
        <div class="greeting-section">
            <div class="time" id="currentTime">00:00:00</div>
            <div class="date" id="currentDate">Monday, January 1, 2026</div>
            <div class="greeting" id="greetingText">Good Morning</div>
            <div class="name-input-container">
                <input type="text" id="userName" placeholder="Enter your name" maxlength="30">
                <button id="saveName">Save</button>
            </div>
            <div class="user-greeting" id="userGreeting"></div>
        </div>

        <!-- Main Content Grid -->
        <div class="main-grid">
            <!-- Focus Timer -->
            <div class="card timer-card">
                <h2>Focus Timer</h2>
                <div class="timer-settings">
                    <label for="timerDuration">Duration (minutes):</label>
                    <input type="number" id="timerDuration" min="1" max="120" value="25">
                    <button id="setTimer">Set</button>
                </div>
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="timer-controls">
                    <button id="startTimer">Start</button>
                    <button id="stopTimer">Stop</button>
                    <button id="resetTimer">Reset</button>
                </div>
            </div>

            <!-- To-Do List -->
            <div class="card todo-card">
                <h2>Tasks</h2>
                <div class="task-sort">
                    <label for="sortTasks">Sort by:</label>
                    <select id="sortTasks">
                        <option value="default">Default</option>
                        <option value="alphabetical">A-Z</option>
                        <option value="status">Status</option>
                    </select>
                </div>
                <div class="task-input-container">
                    <input type="text" id="taskInput" placeholder="Add a new task...">
                    <button id="addTask">Add</button>
                </div>
                <ul class="task-list" id="taskList"></ul>
            </div>

            <!-- Quick Links -->
            <div class="card links-card">
                <h2>Quick Links</h2>
                <div class="link-input-container">
                    <input type="text" id="linkName" placeholder="Link name">
                    <input type="url" id="linkUrl" placeholder="URL">
                    <button id="addLink">Add Link</button>
                </div>
                <div class="links-grid" id="linksGrid"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
